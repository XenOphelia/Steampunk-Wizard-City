[flavor_groups.visual_quality]
name = "Visual Quality"
description = "How fancy do you want the game to look?"
side = "client"
[[flavor_groups.visual_quality.choices]]
id = "eye_candy"
name = "Eye Candy"
description = "Higher default settings, for all the beauty!\n<ul><li>Shaders</li><li>Various small visual upgrades</li><li>Extra UI additions</li></ul>"
[[flavor_groups.visual_quality.choices]]
id = "vr"
name = "VR"
description = "Lower default settings to make VR run smoother, while also keeping visual quality high\n<ul><li>Shaders</li><li>Various small visual upgrades</li><li>Extra UI additions</li></ul>"
[[flavor_groups.visual_quality.choices]]
id = "potato"
name = "Potato"
description = "No shaders or extra fancy visual and UI mods.\n<ul><li><b><i>Might</i> improve performance</b> on low-end PC's</li><li>Some UI improvements will still be selected just for QOL</li><li>Will look closer to Vanilla Minecraft</li></ul>"

[flavor_groups.worldgen]
name = "Worldgen Structures"
description = "Do you want to create singleplayer worlds with the same structure generation mods as a server?\n<ul><li>These files are <b>not needed</b> to connect to a server using this modpack</li></ul>"
side = "both"
choices = ["worldgen_off", "worldgen_on"]

[flavor_groups.jei]
name = "TooManyRecipeViewer"
description = "Recommended alternative to JEI that loads faster on client-side. Do NOT use for server."
side = "both"
choices = ["tmrv_on", "tmrv_off"]

